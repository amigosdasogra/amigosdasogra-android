name: Compilar APKs Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar os dois APKs
        run: gradle --no-daemon assembleAmigosDebug assembleStwpDebug

      - name: Guardar APKs
        uses: actions/upload-artifact@v4
        with:
          name: Amigos-da-Sogra-e-StwpTV
          path: app/build/outputs/apk/**/*.apk
